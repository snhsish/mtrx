<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mtrx - local telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scrollbar-width:thin;scrollbar-color:rgba(74,144,255,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(74,144,255,.28);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(74,144,255,.5);background-clip:content-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
:root{
  --bg:#020b22;
  --bg2:#041233;
  --card:rgba(10,30,70,.55);
  --card-solid:#081a3d;
  --panel:rgba(8,25,60,.72);
  --inner:rgba(3,14,38,.78);
  --border:rgba(74,144,255,.22);
  --border-strong:rgba(74,144,255,.38);
  --text:#f1f6ff;
  --muted:#8fb3e8;
  --muted2:#5f7fb3;
  --accent:#2f7bff;
  --accent2:#4aa0ff;
  --radius:14px;
}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 500px at 50% -120px,#0a2a6b 0%,transparent 60%),radial-gradient(900px 500px at 90% 0%,#0a2f7a 0%,transparent 55%),linear-gradient(180deg,#031033 0%,#020b22 45%,#010818 100%);color:var(--text);margin:0;padding:0;min-height:100vh}
a{color:#60a5fa;text-decoration:none}
.bg-glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 15% 0%,rgba(47,123,255,.18),transparent 70%);z-index:0}
.wrap{max-width:1280px;margin:0 auto;padding:24px 28px 48px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1}
h1 small{font-weight:500;color:var(--muted);font-size:15px;letter-spacing:0;margin-left:10px}
#live{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;background:rgba(20,60,140,.5);border:1px solid var(--border-strong);padding:8px 16px;border-radius:999px;color:#cfe3ff;box-shadow:0 0 18px rgba(47,123,255,.25),inset 0 1px 0 rgba(255,255,255,.12)}
#live i{width:9px;height:9px;background:#22e584;border-radius:50%;box-shadow:0 0 10px rgba(34,229,132,.9)}
.filters{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,rgba(6,22,55,.9),rgba(10,38,95,.85),rgba(15,55,140,.75));border:1px solid var(--border-strong);border-radius:var(--radius);padding:18px 20px;margin:0 0 18px;box-shadow:0 8px 32px rgba(0,10,40,.5),inset 0 1px 0 rgba(255,255,255,.1);flex-wrap:wrap}
.filter-fields{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.field{display:flex;flex-direction:column;gap:7px;flex:1 1 200px;min-width:170px;max-width:300px}
.field label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7ea6e0;line-height:16px;margin:0}
.select-wrap{position:relative;display:flex;align-items:center}
.select-icon{position:absolute;left:12px;color:#4aa0ff;pointer-events:none;display:flex}
.select-chev{position:absolute;right:12px;color:#7ea6e0;pointer-events:none;display:flex}
.filters select,.filters input[type=date]{font-family:'Manrope',sans-serif;appearance:none;-webkit-appearance:none;background:rgba(2,10,30,.75);color:var(--text);border:1px solid var(--border-strong);border-radius:10px;padding:0 36px;font-size:13.5px;font-weight:600;width:100%;height:42px;line-height:40px;outline:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters select:focus{border-color:#4aa0ff;box-shadow:0 0 0 2px rgba(74,160,255,.25)}
.custom-dates{display:flex;gap:8px}
.custom-dates input{min-width:0!important;padding-left:12px!important;padding-right:12px!important}
.filters-meta{text-align:right;font-size:12.5px;font-weight:600;color:#9dbdf0;line-height:1.5}
.filters-meta span{color:#6d90c6}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 18px}
@media(max-width:950px){.two-col{grid-template-columns:1fr}.filters-meta{text-align:left}}
.panel{background:linear-gradient(180deg,rgba(10,32,75,.85),rgba(5,18,45,.9));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 10px 40px rgba(0,8,30,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.panel-head h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8fb8f5;margin:0;display:flex;align-items:center;gap:9px}
.h-icon{width:24px;height:24px;border-radius:50%;background:rgba(47,123,255,.25);border:1px solid rgba(74,160,255,.35);display:inline-flex;align-items:center;justify-content:center;color:#5aa2ff;font-size:13px;font-weight:800}
.h-icon-cube{border-radius:7px}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(8,24,60,.9),rgba(3,12,34,.95));border:1px solid var(--border);border-radius:12px;padding:14px 14px 34px;display:flex;flex-direction:column;gap:2px;min-height:118px}
.stat-top{display:flex;gap:12px;align-items:flex-start}
.stat-ico{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:rgba(47,123,255,.18);border:1px solid rgba(74,160,255,.25);display:flex;align-items:center;justify-content:center;color:#5aa2ff}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8fb3e8;margin-top:2px}
.stat-sub{font-size:12px;color:#6d90c6;font-weight:500;margin-top:3px}
.stat .wave{position:absolute;left:0;right:0;bottom:-1px;height:36px;width:100%;pointer-events:none}
.stat .wave svg{display:block;width:100%;height:100%}
.empty{padding:24px;text-align:center;color:var(--muted)}
.panel-table{padding-bottom:8px}
.search-wrap{display:flex;align-items:center;gap:8px;background:rgba(2,10,30,.7);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:230px;color:#6d90c6}
.search-wrap input{font-family:'Manrope',sans-serif;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%}
.search-wrap input::placeholder{color:#5f7fb3}
#models-wrap{overflow-x:auto;border:1px solid rgba(74,144,255,.14);border-radius:10px;background:rgba(2,10,30,.5)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{color:#6d90c6;text-align:left;font-weight:800;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:13px 14px;border-bottom:1px solid rgba(74,144,255,.16);user-select:none;background:rgba(8,24,60,.5);white-space:nowrap}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:#a9ccff}
th[data-sort].active{color:#4aa0ff}
th .arrow{font-size:10px;margin-left:6px;opacity:.6}
td{padding:12px 14px;border-bottom:1px solid rgba(74,144,255,.1);font-weight:500;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(47,123,255,.06)}
td b{font-weight:800}
.muted-sm{color:#5f7fb3;font-size:11.5px;font-weight:500}
.model-cell{display:flex;align-items:center;gap:11px}
.model-ico{flex:0 0 30px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#4aa0ff;font-size:18px}
.model-ico svg{display:block}
.model-ico-unknown{width:22px;height:22px;border-radius:50%;border:1.5px dashed #5f7fb3;color:#5f7fb3;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;line-height:1}
.model-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cost{font-variant-numeric:tabular-nums;font-weight:600}
@media(max-width:700px){.wrap{padding:16px 14px 32px}.stats-grid{grid-template-columns:1fr 1fr}.filters select{min-width:140px}}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="wrap">
<header class="topbar">
  <h1>mtrx <small>local telemetry</small></h1>
  <span id="live"><i></i> LIVE</span>
</header>

<div id="filters" class="filters">
  <div class="filter-fields">
    <div class="field">
      <label for="range">Range</label>
      <div class="select-wrap">
        <span class="select-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <select id="range"><option value="1d">1 day</option><option value="3d">3 days</option><option value="1w">1 week</option><option value="1m">1 month</option><option value="3m">3 months</option><option value="6m">6 months</option><option value="1y" selected>1 year</option><option value="custom">Custom</option></select>
        <span class="select-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
      <div class="custom-dates">
        <span id="customFromWrap" style="display:none"><input type="date" id="customFrom" aria-label="From"></span>
        <span id="customToWrap" style="display:none"><input type="date" id="customTo" aria-label="To"></span>
      </div>
    </div>
    <div class="field">
      <label for="agent">Agent</label>
      <div class="select-wrap">
        <span class="select-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
        <select id="agent"><option value="">All harnesses</option></select>
        <span class="select-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
    </div>
    <div class="field">
      <label for="model">Model</label>
      <div class="select-wrap">
        <span class="select-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
        <select id="model"><option value="">All models</option></select>
        <span class="select-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
      </div>
    </div>
  </div>
  <div class="filters-meta">Local • Private • Open Source<br><span>Your AI usage, your data.</span></div>
</div>

<div class="two-col">
  <section id="tokens-card" class="panel">
    <div class="panel-head">
      <h3><span class="h-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="4" height="10" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="13" width="4" height="7" rx="1"/></svg></span> Cumulative token usage</h3>
    </div>
    <div id="tokens"><div class="empty">loading…</div></div>
  </section>
  <section id="cost-card" class="panel">
    <div class="panel-head">
      <h3><span class="h-icon h-icon-dollar" aria-hidden="true">$</span> Cost breakdown</h3>
    </div>
    <div id="cost"><div class="empty">No cost data</div></div>
  </section>
</div>

<section class="panel panel-table">
  <div class="panel-head">
    <h3><span class="h-icon h-icon-cube" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></span> Per-model usage</h3>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="modelSearch" type="search" placeholder="Search models..." autocomplete="off">
    </div>
  </div>
  <div id="models-wrap"><table><thead><tr><th data-sort="model">Model</th><th data-sort="calls">Calls</th><th data-sort="input">Input</th><th data-sort="output">Output</th><th data-sort="total">Total tokens</th><th data-sort="cost">Cost</th></tr></thead><tbody id="models"></tbody></table></div>
</section>
</div>
<script>function j(u){return fetch(u).then(r=>r.json())}
function qs(o){const p=new URLSearchParams();for(const[k,v]of Object.entries(o))if(v)p.set(k,v);return p.toString()?'?'+p.toString():''}
function rangeDates(v){const n=new Date();let f=null,t=n;if(v==='1d')f=new Date(n);else if(v==='3d')f=new Date(n);else if(v==='1w')f=new Date(n);else if(v==='1m')f=new Date(n);else if(v==='3m')f=new Date(n);else if(v==='6m')f=new Date(n);else if(v==='1y')f=new Date(n);if(v==='1d')f.setDate(f.getDate()-1);if(v==='3d')f.setDate(f.getDate()-3);if(v==='1w')f.setDate(f.getDate()-7);if(v==='1m')f.setMonth(f.getMonth()-1);if(v==='3m')f.setMonth(f.getMonth()-3);if(v==='6m')f.setMonth(f.getMonth()-6);if(v==='1y')f.setFullYear(f.getFullYear()-1);if(v==='custom'){const cf=document.getElementById('customFrom').value,ct=document.getElementById('customTo').value;return{from:cf?new Date(cf).toISOString():'',to:ct?new Date(new Date(ct).getTime()+86400000-1).toISOString():new Date().toISOString()}}if(!f)return{from:'',to:''};return{from:f.toISOString(),to:t.toISOString()}}
function currentFilters(){const r=document.getElementById('range').value,d=rangeDates(r);return{from:d.from,to:d.to,agent:document.getElementById('agent').value,model:document.getElementById('model').value}}
function fmt(n){return Number(n).toLocaleString()}
function fmtCompact(n){n=Number(n)||0;if(n>=1e9){const v=n/1e9;return(v>=10?v.toFixed(0):v.toFixed(1).replace(/\.0$/,''))+'B'}if(n>=1e6){const v=n/1e6;return(v>=10?v.toFixed(0):v.toFixed(1).replace(/\.0$/,''))+'M'}if(n>=1e3){const v=n/1e3;return(v>=10?v.toFixed(0):v.toFixed(1).replace(/\.0$/,''))+'K'}return fmt(n)}
function fmtCost(n){n=Number(n)||0;if(n===0)return '-';return '$'+n.toFixed(n>=10?2:n>=1?3:4).replace(/0+$/,'').replace(/\.$/,'')}
function formatModel(raw){if(!raw)return 'unknown';let s=String(raw).trim();if((s.startsWith('{')&&s.endsWith('}'))||(s.startsWith('"')&&s.includes('{'))){try{const j=JSON.parse(s);if(typeof j==='string')return j;if(j.provider&&j.model)return j.provider+'/'+j.model;if(j.provider&&j.id)return j.provider+'/'+j.id;if(j.provider&&j.name)return j.provider+'/'+j.name;if(j.id)return j.id;if(j.model)return j.model;if(j.name)return j.name;if(j.provider)return j.provider;}catch{}}try{const j=JSON.parse(s);if(j&&typeof j==='object'){if(j.provider&&j.model)return j.provider+'/'+j.model;if(j.provider&&j.id)return j.provider+'/'+j.id;if(j.id)return j.id;if(j.model)return j.model}}catch{}return s}
var WAVE='<span class="wave" aria-hidden="true"><svg viewBox="0 0 300 36" preserveAspectRatio="none"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f7bff" stop-opacity=".55"/><stop offset="1" stop-color="#2f7bff" stop-opacity=".05"/></linearGradient></defs><path d="M0 26 C 40 26 55 8 95 12 C 135 16 150 28 190 24 C 230 20 245 10 300 14 L300 36 L0 36 Z" fill="url(#wg)"/><path d="M0 28 C 45 28 60 12 100 15 C 140 18 155 30 195 26 C 235 22 250 13 300 16" fill="none" stroke="#4aa0ff" stroke-width="1.4" opacity=".7"/></svg></span>';
var ICO={
db:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
up:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
down:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>',
dollar:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
wallet:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>',
pie:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>',
chart:'<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>',

function formatModelDisplay(raw){var d=formatModel(raw);return '<span class="model-name">'+d+'</span>'}
let modelData=[];let sortKey='total';let sortDir='desc';
function sortModels(){modelData.sort((a,b)=>{let va,vb;if(sortKey==='cost'){va=a.cost||0;vb=b.cost||0}else if(sortKey==='total'){va=(a.input||0)+(a.output||0);vb=(b.input||0)+(b.output||0)}else if(sortKey==='input'){va=a.input||0;vb=b.input||0}else if(sortKey==='output'){va=a.output||0;vb=b.output||0}else if(sortKey==='calls'){va=a.calls||0;vb=b.calls||0}else if(sortKey==='model'){va=formatModel(a.model).toLowerCase();vb=formatModel(b.model).toLowerCase();return sortDir==='asc'?va.localeCompare(vb):vb.localeCompare(va)}else{va=(a.input||0)+(a.output||0);vb=(b.input||0)+(b.output||0)}return sortDir==='asc'?va-vb:vb-va})}
function updateSortHeaders(){document.querySelectorAll('th[data-sort]').forEach(th=>{const k=th.dataset.sort;th.classList.toggle('active',k===sortKey);let arr=th.querySelector('.arrow');if(!arr){arr=document.createElement('span');arr.className='arrow';th.appendChild(arr)}arr.textContent=k===sortKey?(sortDir==='asc'?'▲':'▼'):'↕';arr.style.opacity=k===sortKey?'1':'.35'})}
function filteredModels(){const q=(document.getElementById('modelSearch')||{value:''}).value.trim().toLowerCase();if(!q)return modelData;return modelData.filter(x=>formatModel(x.model).toLowerCase().includes(q))}
function renderModels(){sortModels();updateSortHeaders();const tb=document.getElementById('models');const rows=filteredModels();if(!rows.length){tb.innerHTML='<tr><td colspan=6 class="empty">'+(modelData.length?'no models match search':'no model usage yet')+'</td></tr>';return}tb.innerHTML=rows.map(x=>{const tot=(x.input||0)+(x.output||0);const disp=formatModelDisplay(x.model);const raw=String(x.model).replace(/"/g,'&quot;');return `<tr><td title="${raw}"><span class="model-cell"><span class="model-ico">${modelIcon(formatModel(x.model))}</span>${disp}</span></td><td>${fmt(x.calls)}</td><td title="${fmt(x.input)}">${fmtCompact(x.input)}<br><span class="muted-sm">${fmt(x.input)}</span></td><td title="${fmt(x.output)}">${fmtCompact(x.output)}<br><span class="muted-sm">${fmt(x.output)}</span></td><td title="${fmt(tot)}"><b>${fmtCompact(tot)}</b><br><span class="muted-sm">${fmt(tot)}</span></td><td class="cost">${x.cost?fmtCost(x.cost):'-'}</td></tr>`}).join('')}
function loadAll(){
 const f=currentFilters(),q=qs(f);
 j('/api/v1/metrics/tokens'+q).then(d=>{
  const el=document.getElementById('tokens');
  const costEl=document.getElementById('cost');
  if(!d||!d.length){el.innerHTML='<div class="empty">No token usage in this period</div>';if(costEl)costEl.innerHTML='<div class="empty">No cost data</div>';return}
  const tot=d.reduce((a,x)=>({input:a.input+x.input,output:a.output+x.output,total:a.total+x.total,count:a.count+x.count,cost:(a.cost||0)+(x.cost||0)}),{input:0,output:0,total:0,count:0,cost:0});
  el.innerHTML=`<div class="stats-grid">`
   +statCard(ICO.db,fmtCompact(tot.total),'Total tokens',fmt(tot.count)+' sessions',fmt(tot.total))
   +statCard(ICO.up,fmtCompact(tot.input),'Input',fmt(tot.input),fmt(tot.input))
   +statCard(ICO.down,fmtCompact(tot.output),'Output',fmt(tot.output),fmt(tot.output))
   +statCard(ICO.dollar,tot.cost?fmtCost(tot.cost):'-','Total cost',tot.cost?'avg '+fmtCost(tot.cost/Math.max(1,tot.total/1e6))+'/1M':tot.total?fmtCompact(tot.total)+' tokens':'no data')
   +`</div>`;
  if(costEl){
   if(tot.cost){costEl.innerHTML=`<div class="stats-grid">`
    +statCard(ICO.wallet,fmtCost(tot.cost),'Total',fmtCompact(tot.total)+' tokens')
    +statCard(ICO.pie,fmtCost(tot.cost/Math.max(1,tot.total/1e6)),'Avg / 1M tokens',fmt(tot.count)+' sessions')
    +statCard(ICO.chart,fmtCost(tot.cost/Math.max(1,tot.count)),'Avg / session',fmtCompact(tot.total)+' total')
    +statCard(ICO.tag,fmtCompact(tot.total),'Tokens',fmt(tot.input)+' in · '+fmt(tot.output)+' out')
    +`</div>`}else{costEl.innerHTML='<div class="empty">No cost data for this period</div>'}
  }
 }).catch(()=>{})
 j('/api/v1/metrics/models'+q).then(d=>{modelData=d||[];renderModels()}).catch(()=>{})
}
function populateFilters(){
 j('/api/v1/meta/agents').then(a=>{const s=document.getElementById('agent');const cur=s.value;s.innerHTML='<option value="">All harnesses</option>';a.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o)});if(cur&&[...s.options].some(o=>o.value===cur))s.value=cur}).catch(()=>{});
 j('/api/v1/meta/models').then(a=>{const s=document.getElementById('model');const cur=s.value;s.innerHTML='<option value="">All models</option>';a.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=formatModel(v);s.appendChild(o)});if(cur&&[...s.options].some(o=>o.value===cur))s.value=cur}).catch(()=>{})
}
document.getElementById('range').addEventListener('change',e=>{const c=e.target.value==='custom';document.getElementById('customFromWrap').style.display=c?'':'none';document.getElementById('customToWrap').style.display=c?'':'none';if(!c)loadAll()});
document.getElementById('customFrom').addEventListener('change',()=>{if(document.getElementById('range').value==='custom')loadAll()});
document.getElementById('customTo').addEventListener('change',()=>{if(document.getElementById('range').value==='custom')loadAll()});
document.getElementById('agent').addEventListener('change',loadAll);
document.getElementById('model').addEventListener('change',loadAll);

document.querySelectorAll('th[data-sort]').forEach(th=>{th.addEventListener('click',()=>{const k=th.dataset.sort;if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir=k==='model'||k==='calls'?'asc':'desc'}renderModels()})});
var ms=document.getElementById('modelSearch');if(ms)ms.addEventListener('input',renderModels);
populateFilters();loadAll();
try{var es=new EventSource('/api/v1/live');es.onopen=()=>{const d=document.querySelector('#live i');if(d)d.style.background='#22e584'};es.onerror=()=>{const d=document.querySelector('#live i');if(d)d.style.background='#71717a'}}catch(e){}
</script>
</body>
