<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mtrx - local telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
<header>
  <h1>mtrx <small>local telemetry</small></h1>
  <span id="live"><i></i> live</span>
</header>
<div id="filters" class="filters">
  <label>Range <select id="range"><option value="1m">1 month</option><option value="3m">3 months</option><option value="6m">6 months</option><option value="1y" selected>1 year</option><option value="custom">Custom</option></select></label>
  <label id="customFromWrap" style="display:none">From <input type="date" id="customFrom"></label>
  <label id="customToWrap" style="display:none">To <input type="date" id="customTo"></label>
  <label>Agent <select id="agent"><option value="">All harnesses</option></select></label>
  <label>Model <select id="model"><option value="">All models</option></select></label>
  <button id="reset" type="button" class="btn-ghost">Reset</button>
</div>
<div class="two-col">
  <section id="tokens-card"><h3>Cumulative token usage</h3><div id="tokens">loading…</div></section>
  <section id="cost-card"><h3>Cost breakdown</h3><div id="cost"><div class="empty">No cost data</div></div></section>
</div>
<section><h3>Per-model usage</h3><div id="models-wrap"><table><thead><tr><th data-sort="model">Model</th><th data-sort="calls">Calls</th><th data-sort="input">Input</th><th data-sort="output">Output</th><th data-sort="total">Total tokens</th><th data-sort="cost">Cost</th></tr></thead><tbody id="models"></tbody></table></div></section>
</div>
<script src="/js/app.js"></script>
</body>
</html>
